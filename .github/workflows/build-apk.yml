name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Generate Release Signing Keystore
        run: |
          keytool -genkeypair -v \
            -keystore /tmp/puremusic-release.jks \
            -alias puremusic \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass puremusic123 -keypass puremusic123 \
            -dname "CN=PureMusic, OU=Mobile, O=PureMusic, L=Local, S=Local, C=CN"

      - name: Build Signed Release APK (R8 Optimized)
        env:
          KEYSTORE_PATH: /tmp/puremusic-release.jks
          KEYSTORE_PASSWORD: puremusic123
          KEY_ALIAS: puremusic
          KEY_PASSWORD: puremusic123
        run: gradle assembleRelease --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: PureMusic-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
